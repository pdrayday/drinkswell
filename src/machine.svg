<svg class="machine-art" viewBox="0 0 430 920" role="img" aria-labelledby="mach-t mach-d" xmlns="http://www.w3.org/2000/svg">
  <title id="mach-t">SWELL blender vending machine</title>
  <desc id="mach-d">A slim pink SWELL machine, 17 inches wide and 76 inches tall, with a touchscreen, a cup window and a tap-to-pay reader on the front, and a Berry Bliss smoothie photo wrapped on the side.</desc>
  <defs>
    <linearGradient id="mFront" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6d3dc"/><stop offset=".55" stop-color="#efbccb"/><stop offset="1" stop-color="#e4a3b5"/>
    </linearGradient>
    <linearGradient id="mSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d98ea3"/><stop offset="1" stop-color="#e9b0c0"/>
    </linearGradient>
    <linearGradient id="mScreen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a2230"/><stop offset="1" stop-color="#2a121a"/>
    </linearGradient>
    <linearGradient id="mWin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fbe9ee" stop-opacity=".9"/><stop offset=".18" stop-color="#3a1924"/><stop offset="1" stop-color="#1c0b11"/>
    </linearGradient>
    <radialGradient id="mFloor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2a121a" stop-opacity=".28"/><stop offset="1" stop-color="#2a121a" stop-opacity="0"/></radialGradient>
    <clipPath id="mWinClip"><path d="M96 771h236l-22 240H118z"/></clipPath>
  </defs>

  <ellipse cx="225" cy="890" rx="210" ry="26" fill="url(#mFloor)"/>

  <!-- top face -->
  <path d="M30 110h171.2l192-87H222z" fill="#f8dde4" stroke="#2a121a" stroke-opacity=".25" stroke-width="1"/>

  <!-- side face (872 mm deep, service doors, wrap) -->
  <g transform="matrix(0.2202 -0.0998 0 0.4 201.2 110)">
    <rect width="872" height="1845" fill="url(#mSide)"/>
    <use href="#swell-logo" x="70" y="150" width="730" height="279" fill="#2a121a"/>
    <text x="436" y="520" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="44" letter-spacing="5" fill="#2a121a">PROTEIN SMOOTHIES &amp; SHAKES</text>
    <clipPath id="mSideClip"><rect x="166" y="600" width="540" height="880" rx="34"/></clipPath>
    <rect x="166" y="600" width="540" height="880" rx="34" fill="#050505"/>
    <image href="img/menu/berry-bliss.webp" x="176" y="600" width="520" height="878" clip-path="url(#mSideClip)"/>
    <text x="436" y="1610" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="130" fill="#2a121a">30g · 50g</text>
    <text x="436" y="1680" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="40" letter-spacing="5" fill="#2a121a">FRESH BLENDED IN THE MACHINE</text>
    <path d="M436 40V1760" stroke="#2a121a" stroke-opacity=".22" stroke-width="3"/>
    <rect x="452" y="820" width="22" height="110" rx="6" fill="#2a121a" fill-opacity=".55"/>
    <circle cx="420" cy="875" r="9" fill="#2a121a" fill-opacity=".55"/>
    <rect y="1760" width="872" height="85" fill="#2a121a"/>
    <rect width="872" height="1845" fill="none" stroke="#2a121a" stroke-opacity=".3" stroke-width="3"/>
  </g>

  <!-- front face (428 mm wide: screen, cup window, reader) -->
  <g transform="matrix(0.4 0 0 0.4 30 110)">
    <rect width="428" height="1845" fill="url(#mFront)"/>
    <rect x="30" y="70" width="368" height="160" rx="22" fill="#2a121a"/>
    <use href="#swell-logo" x="64" y="88" width="300" height="115" fill="#f5ccd6"/>
    <!-- touchscreen -->
    <rect x="98" y="269" width="232" height="369" rx="22" fill="#2a121a"/>
    <rect x="110" y="281" width="207" height="345" rx="10" fill="url(#mScreen)"/>
    <text x="213.5" y="326" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="2" fill="#f5ccd6">PICK A BLEND</text>
    <g>
      <circle cx="152" cy="380" r="26" fill="#efe2c6"/><circle cx="213.5" cy="380" r="26" fill="#7b4c36"/><circle cx="275" cy="380" r="26" fill="#d8d0c6"/>
      <circle cx="152" cy="450" r="26" fill="#f2a83a"/><circle cx="213.5" cy="450" r="26" fill="#c8406a"/><circle cx="275" cy="450" r="26" fill="#f1e6b0"/>
    </g>
    <rect x="132" y="510" width="72" height="40" rx="20" fill="#f5ccd6"/>
    <text x="168" y="537" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="18" fill="#2a121a">30g</text>
    <rect x="212" y="510" width="84" height="40" rx="20" fill="#b7cdf2"/>
    <text x="254" y="537" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="20" fill="#14213a">50g</text>
    <rect x="132" y="566" width="164" height="36" rx="18" fill="none" stroke="#f5ccd6" stroke-width="3"/>
    <text x="214" y="590" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="17" fill="#f5ccd6">Blend it</text>
    <!-- cup window -->
    <text x="214" y="735" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="4" fill="#2a121a">FRESH BLENDED</text>
    <path d="M84 759h260l-24 264H108z" fill="#2a121a"/>
    <path d="M96 771h236l-22 240H118z" fill="url(#mWin)"/>
    <g clip-path="url(#mWinClip)"><image href="img/menu/mango.webp" x="124" y="768" width="180" height="304"/></g>
    <path d="M118 1011h192" stroke="#f5ccd6" stroke-opacity=".5" stroke-width="3"/>
    <!-- tap to pay -->
    <rect x="176" y="1120" width="76" height="76" rx="14" fill="#2a121a"/>
    <g fill="none" stroke="#f5ccd6" stroke-width="5" stroke-linecap="round">
      <path d="M204 1144a20 20 0 0 1 0 28"/><path d="M214 1137a32 32 0 0 1 0 42"/><path d="M224 1130a44 44 0 0 1 0 56"/>
    </g>
    <text x="214" y="1236" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#2a121a">TAP TO PAY</text>
    <!-- size chips -->
    <rect x="44" y="1330" width="340" height="150" rx="20" fill="#2a121a"/>
    <use href="#swell-logo" x="66" y="1352" width="140" height="54" fill="#f5ccd6"/>
    <text x="136" y="1456" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="24" fill="#f5ccd6">30g</text>
    <path d="M214 1352v106" stroke="#f5ccd6" stroke-opacity=".35" stroke-width="2"/>
    <text x="300" y="1412" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="54" fill="#b7cdf2">SWOLL</text>
    <text x="300" y="1456" text-anchor="middle" font-family="Instrument Sans, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="24" fill="#b7cdf2">50g</text>
    <rect y="1760" width="428" height="85" fill="#2a121a"/>
    <rect width="428" height="1845" fill="none" stroke="#2a121a" stroke-opacity=".3" stroke-width="3"/>
  </g>

  <!-- casters -->
  <g fill="#2a121a">
    <rect x="44" y="848" width="18" height="10"/><circle cx="53" cy="868" r="12"/>
    <rect x="178" y="848" width="18" height="10"/><circle cx="187" cy="868" r="12"/>
    <rect x="368" y="770" width="16" height="9" opacity=".8"/><circle cx="376" cy="789" r="11" opacity=".8"/>
  </g>
</svg>
